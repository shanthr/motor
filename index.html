<!DOCTYPE html>
<html>
<head>
<title>Water Pump Controller</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>

body{
font-family: Arial;
text-align:center;
background:#111;
color:white;
}

.container{
margin-top:50px;
}

.level{
font-size:40px;
margin:20px;
}

button{
font-size:22px;
padding:15px 40px;
margin:15px;
border:none;
border-radius:10px;
}

.on{
background:#2ecc71;
color:white;
}

.off{
background:#e74c3c;
color:white;
}

.status{
font-size:20px;
margin-top:20px;
}

</style>

</head>

<body>

<div class="container">

<h1>Water Pump Control</h1>

<div class="level">
Water Level: <span id="level">--</span> %
</div>

<button class="on" onclick="motorOn()">Pump ON</button>
<button class="off" onclick="motorOff()">Pump OFF</button>

<div class="status">
Motor Status: <span id="status">OFF</span>
</div>

</div>

<script>

var firebaseConfig = {
apiKey: "AIzaSyBwFxRZ_JWBVkTRoP1nYsLPQuzfw2XEWnA",
databaseURL: "https://esp-firebase-demo-42-default-rtdb.firebaseio.com/"
};

firebase.initializeApp(firebaseConfig);

var db = firebase.database();


// ----- READ WATER LEVEL -----

db.ref("motor/level").on("value", function(snapshot){

var level = snapshot.val();

if(level != null){

document.getElementById("level").innerHTML = level.toFixed(1);

}

});


// ----- READ MOTOR STATUS -----

db.ref("motor/cmd").on("value", function(snapshot){

var cmd = snapshot.val();

if(cmd == 1){
document.getElementById("status").innerHTML = "ON";
}
else{
document.getElementById("status").innerHTML = "OFF";
}

});


// ----- MOTOR CONTROL -----

function motorOn(){

db.ref("motor/cmd").set(1);

}

function motorOff(){

db.ref("motor/cmd").set(0);

}

</script>

</body>
</html>
